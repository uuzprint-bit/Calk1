name: Build UZPRINT APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create project
        run: |
          mkdir -p app/src/main/java/uz/uzprint/calculator app/src/main/assets
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='UZPRINT'; include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'uz.uzprint.calculator'; compileSdk 35
            defaultConfig { applicationId 'uz.uzprint.calculator'; minSdk 23; targetSdk 35; versionCode 2; versionName '2.0' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="UZPRINT Kalkulyator"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/uz/uzprint/calculator/MainActivity.java <<'EOF'
          package uz.uzprint.calculator;
          import android.app.Activity;import android.os.Bundle;import android.webkit.WebView;import android.webkit.WebViewClient;
          public class MainActivity extends Activity{public void onCreate(Bundle b){super.onCreate(b);WebView w=new WebView(this);setContentView(w);w.getSettings().setJavaScriptEnabled(true);w.getSettings().setDomStorageEnabled(true);w.setWebViewClient(new WebViewClient());w.loadUrl("file:///android_asset/index.html");}}
          EOF
          cat > app/src/main/assets/index.html <<'EOF'
          <!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UZPRINT</title><style>
          *{box-sizing:border-box}body{margin:0;padding:14px;background:#07111f;color:#fff;font-family:Arial,sans-serif}h1{text-align:center;color:#4ade80;margin:10px}.card{background:#132238;padding:14px;border-radius:16px;margin:12px 0;border:1px solid #263b55}label{display:block;color:#b8c6d8;font-size:14px;margin:7px 0 4px}input{width:100%;padding:11px;background:#07111f;color:#fff;border:1px solid #475569;border-radius:9px;font-size:16px}.prices,.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.head,.line{display:flex;justify-content:space-between;align-items:center;gap:8px}.head{margin-bottom:7px}.line{padding:9px 0;border-bottom:1px solid #30445c}.line:last-child{border:0}.line span{color:#b8c6d8}.total{color:#4ade80;font-size:18px}.mount{color:#fde68a}.size{background:#0d1a2b;padding:12px;border-radius:12px;margin:10px 0}.sizeout{display:flex;justify-content:space-between;color:#93c5fd;font-size:13px;margin-top:9px}.add,.remove{border:0;border-radius:10px;font-weight:bold}.add{width:100%;padding:13px;background:#22c55e;color:#052e16;font-size:16px}.remove{background:#7f1d1d;color:#fecaca;padding:7px 10px}.choice{border-left:4px solid #4ade80}.alt{border-left-color:#60a5fa}@media(max-width:400px){.prices{grid-template-columns:1fr}}
          </style></head><body><h1>UZPRINT</h1>
          <div class="card"><div class="prices"><div class="full"><label>Banner narxi — 1 m²</label><input id="bp" type="number" value="25000"></div><div><label>3×4 reyka — 1 metr</label><input id="r34" type="number" value="10000"></div><div><label>3×2 reyka — 1 metr</label><input id="r32" type="number" value="8000"></div></div></div>
          <div class="card"><div class="head"><b>RAZMERLAR</b><span id="count">0 ta</span></div><div id="rows"></div><button class="add" id="add">+ RAZMER QO‘SHISH</button></div>
          <div class="card"><div class="line"><span>Jami dona</span><b id="qty"></b></div><div class="line"><span>Banner maydoni</span><b id="area"></b></div><div class="line"><span>Reyka jami metri</span><b id="rails"></b></div></div>
          <div class="card choice"><h3>3×4 REYKA</h3><div class="line"><span>Banner</span><b id="banner34"></b></div><div class="line"><span>Reyka</span><b id="rail34"></b></div><div class="line"><span>Banner + reyka</span><b id="total34"></b></div><div class="line mount"><span>G‘ijduvon montaj</span><b id="montaj34"></b></div><div class="line total"><span>JAMI + MONTAJ</span><b id="final34"></b></div></div>
          <div class="card choice alt"><h3>3×2 REYKA</h3><div class="line"><span>Banner</span><b id="banner32"></b></div><div class="line"><span>Reyka</span><b id="rail32"></b></div><div class="line"><span>Banner + reyka</span><b id="total32"></b></div><div class="line mount"><span>G‘ijduvon montaj</span><b id="montaj32"></b></div><div class="line total"><span>JAMI + MONTAJ</span><b id="final32"></b></div></div>
          <script>
          var data=[];function num(v){v=Number(v);return isFinite(v)?Math.max(0,v):0}function money(v){return Math.round(v).toLocaleString('ru-RU')+' so‘m'}function addRow(o){if(data.length>=20)return;data.push(o||{w:3,h:4,q:1,gh:0,gv:0});render()}
          function render(){rows.innerHTML='';data.forEach(function(r,i){var d=document.createElement('div');d.className='size';d.innerHTML='<div class="head"><b>'+(i+1)+'-razmer</b><button class="remove">O‘CHIRISH</button></div><div class="fields"><div><label>Eni (m)</label><input data-k="w" type="number" step="0.01" value="'+r.w+'"></div><div><label>Bo‘yi (m)</label><input data-k="h" type="number" step="0.01" value="'+r.h+'"></div><div><label>Dona</label><input data-k="q" type="number" value="'+r.q+'"></div><div><label>↔ Gorizontal</label><input data-k="gh" type="number" value="'+r.gh+'"></div><div><label>↕ Vertikal</label><input data-k="gv" type="number" value="'+r.gv+'"></div></div><div class="sizeout"><span class="a"></span><span class="r"></span></div>';d.querySelectorAll('input').forEach(function(x){x.oninput=function(){r[x.dataset.k]=num(x.value);calc()}});d.querySelector('.remove').onclick=function(){data.splice(i,1);if(!data.length)data.push({w:3,h:4,q:1,gh:0,gv:0});render()};rows.appendChild(d)});calc()}
          function calc(){var A=0,R=0,Q=0;data.forEach(function(r,i){var q=Math.max(1,Math.round(num(r.q))),a=num(r.w)*num(r.h)*q,m=(2*(num(r.w)+num(r.h))+num(r.gh)*num(r.w)+num(r.gv)*num(r.h))*q;A+=a;R+=m;Q+=q;var el=rows.children[i];if(el){el.querySelector('.a').textContent=a.toFixed(2)+' m²';el.querySelector('.r').textContent=m.toFixed(2)+' m'}});var b=A*num(bp.value),x=R*num(r34.value),y=R*num(r32.value),mt=A*15000;count.textContent=data.length+' ta';qty.textContent=Q;area.textContent=A.toFixed(2)+' m²';rails.textContent=R.toFixed(2)+' m';banner34.textContent=money(b);banner32.textContent=money(b);rail34.textContent=money(x);rail32.textContent=money(y);total34.textContent=money(b+x);total32.textContent=money(b+y);montaj34.textContent=money(mt);montaj32.textContent=money(mt);final34.textContent=money(b+x+mt);final32.textContent=money(b+y+mt);try{localStorage.setItem('uzrows',JSON.stringify(data));localStorage.setItem('uzprices',JSON.stringify([bp.value,r34.value,r32.value]))}catch(e){}}
          add.onclick=function(){addRow({w:3,h:4,q:1,gh:0,gv:0})};[bp,r34,r32].forEach(function(x){x.oninput=calc});try{var p=JSON.parse(localStorage.getItem('uzprices'));if(p){bp.value=p[0];r34.value=p[1];r32.value=p[2]}var s=JSON.parse(localStorage.getItem('uzrows'));if(Array.isArray(s)&&s.length)data=s.slice(0,20)}catch(e){}if(!data.length)data=[{w:3,h:4,q:1,gh:0,gv:0}];render();
          </script></body></html>
          EOF
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UZPRINT-Kalkulyator-v2.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UZPRINT-Kalkulyator-v2-APK
          path: UZPRINT-Kalkulyator-v2.apk
          if-no-files-found: error
